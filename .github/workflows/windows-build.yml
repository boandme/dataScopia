name: Build Windows desktop app

# Builds the standalone Windows build (packaging/datascopia.spec) and attaches it to a GitHub
# Release whenever a version tag is pushed - e.g. `git tag v1.34 && git push origin v1.34` - so
# distributing a new version never requires running PyInstaller locally.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller packaging/datascopia.spec --clean --distpath dist_desktop --workpath build_desktop -y
      - name: Zip the build
        run: Compress-Archive -Path dist_desktop/DataScopia -DestinationPath DataScopia-windows.zip
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DataScopia-windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: DataScopia-windows
          path: DataScopia-windows.zip
